name: Build and verify

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Interface and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Instalar ferramentas iOS de fonte rastreável
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-libimobiledevice
            mingw-w64-ucrt-x86_64-libusbmuxd

      - name: Preparar ferramentas USB e manifesto
        shell: msys2 {0}
        run: |
          set -euo pipefail
          destination="$GITHUB_WORKSPACE/src-tauri/resources/bin/windows"
          mkdir -p "$destination"
          for program in ideviceinfo.exe idevicediagnostics.exe iproxy.exe; do
            test -f "/ucrt64/bin/$program"
            cp "/ucrt64/bin/$program" "$destination/"
          done
          for program in "$destination"/*.exe; do
            ldd "$program" | awk '$3 ~ /^\/ucrt64\/bin\// { print $3 }' | while read -r dependency; do
              cp -n "$dependency" "$destination/" || true
            done
          done
          {
            echo "Pacotes MSYS2 usados nesta compilação"
            pacman -Q mingw-w64-ucrt-x86_64-libimobiledevice mingw-w64-ucrt-x86_64-libusbmuxd
            echo
            echo "SHA-256 dos executáveis e bibliotecas incorporados"
            cd "$destination"
            sha256sum ./*.exe ./*.dll
          } > "$destination/toolchain-manifest.txt"

      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Testar backend Rust
        run: cargo test --release --manifest-path src-tauri/Cargo.toml
      - name: Gerar MSI e instalador EXE
        run: npm run tauri build

      - name: Publicar instaladores como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ios-storage-forensics-windows
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error


  linux:
    name: Linux packages
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Instalar dependências do Tauri e ferramentas iOS
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libimobiledevice-utils \
            libusbmuxd-tools \
            usbmuxd \
            patchelf \
            libfuse2 \
            xvfb \
            xdotool

      - name: Verificar ferramentas USB do Linux
        run: |
          command -v ideviceinfo
          command -v idevicediagnostics
          command -v iproxy

      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Testar backend Rust no Linux
        run: cargo test --release --manifest-path src-tauri/Cargo.toml
      - name: Gerar DEB e AppImage
        run: npm run tauri build

      - name: Corrigir compatibilidade do AppImage com Mesa recente
        run: |
          appimage=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          plugin=$(find "$HOME/.cache/tauri" -type f -name 'linuxdeploy-plugin-appimage-x86_64.AppImage' -print -quit 2>/dev/null || true)
          if [ -z "$plugin" ]; then
            plugin="$RUNNER_TEMP/linuxdeploy-plugin-appimage-x86_64.AppImage"
            curl --fail --location --retry 3 \
              --output "$plugin" \
              'https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage'
          fi
          echo 'a45d3e227bc7f397e9cf6bfa4c9507494efa2293357b6e86690a3de2ca992e79' "${plugin}" | sha256sum --check
          ./scripts/fix-appimage-compatibility.sh "$appimage" "$plugin"

      - name: Testar inicialização gráfica do AppImage
        run: |
          appimage=$(find src-tauri/target/release/bundle/appimage -maxdepth 1 -type f -name '*.AppImage' -print -quit)
          timeout 20 xvfb-run -a bash -c '
            APPIMAGE_EXTRACT_AND_RUN=1 "$1" &
            app_pid=$!
            trap "kill $app_pid 2>/dev/null || true" EXIT
            for attempt in {1..20}; do
              if xdotool search --name "^iOS Storage Forensics$" >/dev/null 2>&1; then
                sleep 2
                pgrep -f WebKitWebProcess >/dev/null
                exit 0
              fi
              kill -0 "$app_pid" 2>/dev/null || exit 1
              sleep 0.5
            done
            exit 1
          ' _ "$appimage"

      - name: Publicar pacotes Linux como artefato
        uses: actions/upload-artifact@v4
        with:
          name: ios-storage-forensics-linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

  release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ios-storage-forensics-*
          path: release-assets
          merge-multiple: true

      - name: Publicar todos os instaladores
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t files < <(find release-assets -maxdepth 1 -type f -print | sort)
          test "${#files[@]}" -ge 4
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" "${files[@]}" --generate-notes \
              --title "iOS Storage Forensics $GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          fi
